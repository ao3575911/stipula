name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest -q
      - name: Offline check
        run: python -m telegram_innovation check --offline
        env:
          DATABASE_PATH: /tmp/stipula.sqlite3
          LOG_PATH: ""
          LOG_SALT: ci
